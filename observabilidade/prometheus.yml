global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["192.168.0.8:8081"]

  - job_name: "ingestion-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["192.168.0.8:8080"]

  - job_name: "alert-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["192.168.0.8:8083"]

  - job_name: "historical-temp-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["192.168.0.8:8084"]